<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Featured Events</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

                        <!-- navbar -->
        <header class="navbar">
            <div class="container navbar-container ">
                <div class="logo">Eventify</div>

                <nav class="navbar-links">
                    <a href="#">Home</a>
                    <a href="#">Events</a>
                    <a href="#">Contact</a>
                </nav>
            </div>
        </header>

                         <!-- hero section -->
        <section class="herosection">
            <div class="container hero-content">
                <h1>Discover Events Near You!</h1>
                <p>Find the best events happening around you</p>
            </div>
        </section>

                        <!-- Main Events content -->

         <main class="main-content">

                <!-- search bar -->
            <section class="search-section">
                    <input type="text" placeholder="Search events..." id="searchEvents">
            </section>

                <!-- Events section -->
            <section class="events-section">
                <h2>Featured Events</h2>    
                <div class="events-cards" id="eventsContainer">
                       

                </div>
            </section>
        </main>

        <footer class="footer">
            <p>&copy; 2026 Eventify. All rights reserved.</p>
        </footer>
    
    <script src="script.js"></script>
</body>
</html>
